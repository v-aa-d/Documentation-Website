<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Morph Grid</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>

<div id="sidebar">
  <div class="grp">
    <div class="hz-row">
      <span id="lbl-pts"></span>
      <span id="val-pts"></span>
    </div>
    <input type="range" id="nPts">
  </div>
  <div class="grp">
    <div class="hz-row">
      <span id="lbl-dot"></span>
      <span id="val-dot"></span>
    </div>
    <input type="range" id="dotSize">
  </div>
  <div class="grp">
    <div class="hz-row">
      <span id="lbl-strokes"></span>
      <span id="val-strokes"></span>
    </div>
    <input type="range" id="numStrokes">
  </div>
  <div class="grp">
    <div class="hz-row">
      <span id="lbl-spacing"></span>
      <span id="val-spacing"></span>
    </div>
    <input type="range" id="strokeSpacing">
  </div>
  <div class="grp">
    <span id="lbl-interp"></span>
    <div id="interp-list"></div>
  </div>
  <div class="grp">
    <span id="lbl-shape"></span>
    <div id="shape-list"></div>
  </div>
  <div class="grp">
    <button id="linesBtn"></button>
    <button id="fillBtn"></button>
  </div>
  <div class="grp">
    <button id="exportSvgBtn"></button>
    <button id="exportPngBtn"></button>
  </div>
</div>

<div id="main"><div id="sketch"></div></div>

<div id="grid-panel">
  <div id="word-section">
    <div id="word-input-row">
      <input type="text" id="wordInput" placeholder="ADD WORD" maxlength="12" autocomplete="off" spellcheck="false">
      <button id="addWordBtn">+</button>
    </div>
    <div id="word-buttons"></div>
  </div>
</div>

<script src="sketch.js"></script>
</body>
</html>
